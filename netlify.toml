[build]
  base = "Ai travel assistant/frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://traveliq-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ai/*"
  to = "https://traveliq-ai-service.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
