<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="aevora-grad-primary" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20C5D9" />
      <stop offset="100%" stop-color="#42D6B5" />
    </linearGradient>
    <linearGradient id="aevora-grad-accent" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101B2D" />
      <stop offset="100%" stop-color="#20C5D9" />
    </linearGradient>
    <filter id="aevora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="16" fill="#101B2D" />

  <!-- Geometric "A" structure with integrated navigation waypoint pathway -->
  <!-- Left stem angled outward -->
  <path d="M32 10 L14 52 L22.5 52 L32 28 L41.5 52 L50 52 L32 10 Z" fill="url(#aevora-grad-primary)" />

  <!-- Navigation crossbar / forward dynamic flight trajectory -->
  <path d="M21 39 L47 31 L41 36 L25 41 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Central Waypoint Compass Diamond Node -->
  <polygon points="32,23 35.5,28 32,33 28.5,28" fill="#FFFFFF" filter="url(#aevora-glow)" />

  <!-- Forward Vector Pulse -->
  <circle cx="47" cy="31" r="2.5" fill="#42D6B5" />
</svg>

