services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-traveliq}
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - CLIENT_SHIELD_SECRET=${CLIENT_SHIELD_SECRET}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - ADMIN_PROVISIONING_TOKEN=${ADMIN_PROVISIONING_TOKEN}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-admin@traveliq.com}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-AdminSecure2026!}
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./ai-services
    # Port 8000 is internal-only; not published to the public host interface
    expose:
      - "8000"
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-traveliq}
      - DB_PORT=3306
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    # Bound to local loopback interface only for developer tooling; not exposed publicly
    ports:
      - "127.0.0.1:3306:3306"
    expose:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-traveliq}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
